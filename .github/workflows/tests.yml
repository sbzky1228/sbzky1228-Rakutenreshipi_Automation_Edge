# GitHub Actions: GitHubにpushしたとき・プルリクエストを作ったときに、自動でテストを実行する
# 楽天レシピやデータベースには接続しない（.env は不要）
name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:  # GitHubの「Actions」画面から手動でも実行できる

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: パッケージをインストール
        run: pip install -r requirements-dev.txt

      - name: 未使用・誤りのチェック（pyflakes）
        run: python -m pyflakes main.py recipe_poster tools tests

      - name: 使っていないコードのチェック（vulture）
        run: python -m vulture main.py recipe_poster tools tests --min-confidence 60

      - name: 自動テスト（pytest）
        run: python -m pytest tests -v
